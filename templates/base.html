<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Quiz Application</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #1e293b;
        background: #f1f5f9;
        line-height: 1.5;
      }

      .hero {
        background: linear-gradient(
          135deg,
          #4f46e5 0%,
          #7c3aed 50%,
          #06b6d4 100%
        );
        padding: 20px 20px 26px;
      }
      .hero-inner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        color: #ffffff;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      .hero-right {
        color: #e0e7ff;
        font-size: 13px;
      }
      .hero-right a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
      }
      .hero-right a:hover {
        text-decoration: underline;
      }

      .page-wrap {
        max-width: 720px;
        margin: -10px auto 0;
        padding: 0 20px 60px;
      }

      h1 {
        font-size: 24px;
        font-weight: 800;
        color: #1e1b4b;
        margin: 22px 0 18px;
      }
      h2 {
        font-size: 18px;
        font-weight: 700;
        color: #1e293b;
        margin: 0 0 14px;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
        color: #334155;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: #475569;
      }
      code {
        background: #eef2ff;
        color: #4338ca;
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 13px;
        font-family: "Consolas", monospace;
      }

      .card {
        background: linear-gradient(160deg, #eef2ff 0%, #ffffff 55%);
        border: 1px solid #e0e7ff;
        border-left: 5px solid #6366f1;
        border-radius: 12px;
        padding: 26px 28px;
        margin: 18px 0;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.1);
      }
      .card.accent-cyan {
        background: linear-gradient(160deg, #ecfeff 0%, #ffffff 55%);
        border-left-color: #06b6d4;
        box-shadow: 0 4px 14px rgba(6, 182, 212, 0.1);
      }
      .card.accent-amber {
        background: linear-gradient(160deg, #fffbeb 0%, #ffffff 55%);
        border-left-color: #f59e0b;
        box-shadow: 0 4px 14px rgba(245, 158, 11, 0.12);
      }
      .card.accent-green {
        background: linear-gradient(160deg, #ecfdf5 0%, #ffffff 55%);
        border-left-color: #10b981;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.1);
      }
      .card.accent-rose {
        background: linear-gradient(160deg, #fff1f2 0%, #ffffff 55%);
        border-left-color: #f43f5e;
      }

      .option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 16px;
        margin: 8px 0;
        border: 1.5px solid #e0e7ff;
        border-radius: 8px;
        background: #ffffff;
        cursor: pointer;
        font-size: 15px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .option:hover {
        border-color: #6366f1;
        background: #f5f5ff;
      }

      button,
      input[type="submit"] {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.15s;
        box-shadow: 0 3px 10px rgba(79, 70, 229, 0.4);
      }
      button:hover,
      input[type="submit"]:hover {
        box-shadow: 0 5px 16px rgba(79, 70, 229, 0.5);
        transform: translateY(-1px);
      }
      button:disabled {
        background: #cbd5e1;
        box-shadow: none;
        cursor: not-allowed;
      }

      input[type="text"],
      select {
        padding: 10px 12px;
        border: 1.5px solid #c7d2fe;
        border-radius: 8px;
        font-size: 15px;
        width: 100%;
        background: #ffffff;
        color: #1e293b;
      }
      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }

      .correct {
        color: #16a34a;
        font-weight: 700;
      }
      .incorrect {
        color: #e11d48;
        font-weight: 700;
      }

      label {
        display: block;
        margin: 16px 0 6px;
        font-size: 12px;
        font-weight: 700;
        color: #6366f1;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .badge {
        display: inline-block;
        padding: 3px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
        color: #4338ca;
      }
      .badge.amber {
        background: linear-gradient(135deg, #fde68a, #fcd34d);
        color: #78350f;
      }
      .badge.green {
        background: linear-gradient(135deg, #a7f3d0, #6ee7b7);
        color: #065f46;
      }

      .instructions li {
        margin-bottom: 8px;
        color: #475569;
      }
      .instructions {
        padding-left: 20px;
      }

      .score-hero {
        text-align: center;
        padding: 16px 0;
      }
      .score-hero .big-number {
        font-size: 48px;
        font-weight: 800;
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      @media (max-width: 480px) {
        .page-wrap {
          padding: 0 14px 40px;
        }
        h1 {
          font-size: 21px;
        }
        .card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="hero-inner">
        <div class="brand">Quiz Application</div>
        <div class="hero-right">{% block hero_right %}{% endblock %}</div>
      </div>
    </div>
    <div class="page-wrap">{% block content %}{% endblock %}</div>
  </body>
</html>
